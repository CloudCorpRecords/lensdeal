openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: screener
    description: Live acquisition traffic screens
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /screen:
    post:
      operationId: createScreen
      tags: [screener]
      summary: Compare two domains with a first-pass traffic screen
      description: Calls Similarweb for recent estimates and Crusoe for an evidence-constrained brief. Each submission consumes provider credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenInput"
      responses:
        "200":
          description: Completed live screen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenReport"
        "400":
          description: Invalid domains
        "502":
          description: Provider request failed or access is insufficient
  /account:
    get:
      operationId: getAccount
      tags: [screener]
      summary: Current account, entitlements and monthly usage
      responses:
        "200":
          description: Current usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatus" }
  /discover/startups:
    get:
      operationId: discoverStartups
      tags: [screener]
      summary: Browse a bounded page of TrustMRR listings for domain selection
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 20, default: 1 }
        - in: query
          name: category
          schema: { type: string, enum: [ai, saas, developer-tools, fintech, marketing, ecommerce, productivity, analytics, education, marketplace, mobile-apps] }
        - in: query
          name: onSale
          schema: { type: string, enum: ["true", "false"] }
        - in: query
          name: sort
          schema: { type: string, enum: [revenue-desc, listed-desc, best-deal], default: revenue-desc }
      responses:
        "200":
          description: One provider page, with only fields needed to choose a website
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPage" }
        "400": { description: Invalid browse filters }
        "429": { description: Discovery request rate limited }
        "503": { description: Provider unavailable or not configured }
  /screens:
    get:
      operationId: listScreens
      tags: [screener]
      summary: List my completed screens
      responses:
        "200":
          description: Personal screen history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedScreen" }
  /screens/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getScreen
      tags: [screener]
      summary: Retrieve one of my saved screens
      responses:
        "200":
          description: Saved screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedScreen" }
    delete:
      operationId: deleteScreen
      tags: [screener]
      summary: Delete one of my saved screens
      responses:
        "204": { description: Deleted }
  /compilations:
    get:
      operationId: listCompilations
      tags: [screener]
      summary: List my research compilations
      responses:
        "200":
          description: Compilations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Compilation" }
    post:
      operationId: createCompilation
      tags: [screener]
      summary: Group selected saved screens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompilationInput" }
      responses:
        "201":
          description: Saved compilation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compilation" }
  /compilations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getCompilation
      tags: [screener]
      summary: Retrieve compilation and included screens
      responses:
        "200":
          description: Compilation detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompilationDetail" }
    delete:
      operationId: deleteCompilation
      tags: [screener]
      summary: Delete a compilation
      responses:
        "204": { description: Deleted }
  /compilations/{id}/copilot:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: listCopilotAnswers
      tags: [screener]
      summary: List my saved answers for a research compilation
      responses:
        "200":
          description: Saved copilot answers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CopilotAnswer" }
        "404": { description: Compilation not found }
    post:
      operationId: askCopilot
      tags: [screener]
      summary: Ask a bounded, cited research question using one AI question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopilotInput" }
      responses:
        "200":
          description: Cited copilot answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotAnswer" }
        "404": { description: Compilation or source reports not found }
        "422": { description: Insufficient source evidence }
        "429": { description: AI allowance exhausted }
        "502": { description: Provider failed or returned ungrounded content }
  /explanations:
    post:
      operationId: createExplanation
      tags: [screener]
      summary: Ask an evidence-grounded question about a saved screen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExplanationInput" }
      responses:
        "200":
          description: Cited answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explanation" }
  /screens/{id}/explanations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: listExplanations
      tags: [screener]
      summary: My AI questions for a saved screen
      responses:
        "200":
          description: Question history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Explanation" }
  /billing/plans:
    get:
      operationId: listPlans
      tags: [screener]
      summary: Available subscription tiers
      responses:
        "200":
          description: Plans and checkout availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanCatalog" }
  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [screener]
      summary: Begin a test-mode or approved live subscription upgrade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Hosted checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingLink" }
  /billing/portal:
    post:
      operationId: createPortal
      tags: [screener]
      summary: Manage current subscription
      responses:
        "200":
          description: Hosted billing portal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingLink" }
components:
  schemas:
    DiscoveryCompany:
      type: object
      required: [name, slug, description, category, website, domain, listingUrl, onSale]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        domain: { type: ["string", "null"] }
        listingUrl: { type: string }
        onSale: { type: boolean }
    DiscoveryPage:
      type: object
      required: [data, page, hasMore]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryCompany" }
        page: { type: integer }
        hasMore: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScreenInput:
      type: object
      additionalProperties: false
      required: [targetDomain, requestId]
      properties:
        targetDomain: { type: string, minLength: 4, maxLength: 253 }
        comparisonDomain: { type: string, minLength: 4, maxLength: 253 }
        comparisonDomains:
          type: array
          items: { type: string, minLength: 4, maxLength: 253 }
        requestId: { type: string, minLength: 8, maxLength: 100 }
    TimePoint:
      type: object
      required: [month, visits]
      properties:
        month: { type: string }
        visits: { type: number }
    ShareItem:
      type: object
      required: [label, share]
      properties:
        label: { type: string }
        share: { type: number }
    DomainProfile:
      type: object
      required: [domain, monthlyVisits, averageVisits, trafficChangePercent, channels, geography, topCountry, topChannel]
      properties:
        domain: { type: string }
        monthlyVisits:
          type: array
          items: { $ref: "#/components/schemas/TimePoint" }
        averageVisits: { type: number }
        trafficChangePercent: { type: ["number", "null"] }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ShareItem" }
        geography:
          type: array
          items: { $ref: "#/components/schemas/ShareItem" }
        topCountry:
          type: ["object", "null"]
          properties:
            label: { type: string }
            share: { type: number }
        topChannel:
          type: ["object", "null"]
          properties:
            label: { type: string }
            share: { type: number }
    Finding:
      type: object
      required: [id, severity, title, metric, value, period, source, sourceUrl, whyItMatters, verificationQuestion]
      properties:
        id: { type: string }
        severity: { type: string, enum: [watch, context] }
        title: { type: string }
        metric: { type: string }
        value: { type: string }
        period: { type: string }
        source: { type: string }
        sourceUrl: { type: string }
        whyItMatters: { type: string }
        verificationQuestion: { type: string }
    ScreenReport:
      type: object
      required: [generatedAt, period, sourceNotice, target, findings, summary, sellerQuestions, limitations]
      properties:
        generatedAt: { type: string }
        id: { type: string }
        period: { type: string }
        sourceNotice: { type: string }
        target: { $ref: "#/components/schemas/DomainProfile" }
        comparison: { $ref: "#/components/schemas/DomainProfile" }
        additionalProfiles:
          type: array
          items: { $ref: "#/components/schemas/DomainProfile" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        summary: { type: string }
        sellerQuestions:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
    SavedScreen:
      type: object
      required: [id, createdAt, targetDomain, comparisonDomains, report]
      properties:
        id: { type: string }
        createdAt: { type: string }
        targetDomain: { type: string }
        comparisonDomains:
          type: array
          items: { type: string }
        report: { $ref: "#/components/schemas/ScreenReport" }
    AccountStatus:
      type: object
      required: [tier, screensUsed, screenLimit, aiUsed, aiLimit, resetsAt, billingEnabled, billingMode, hasBillingCustomer]
      properties:
        tier: { type: string, enum: [free, pro, team, enterprise] }
        screensUsed: { type: integer }
        screenLimit: { type: integer }
        aiUsed: { type: integer }
        aiLimit: { type: integer }
        resetsAt: { type: string }
        billingEnabled: { type: boolean }
        billingMode: { type: string, enum: [test, live, unavailable] }
        hasBillingCustomer: { type: boolean }
    CompilationInput:
      type: object
      required: [title, screenIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        screenIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
    Compilation:
      type: object
      required: [id, title, screenIds, summary, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        screenIds:
          type: array
          items: { type: string }
        summary: { type: string }
        createdAt: { type: string }
    CompilationDetail:
      type: object
      required: [id, title, screenIds, summary, createdAt, screens]
      properties:
        id: { type: string }
        title: { type: string }
        screenIds:
          type: array
          items: { type: string }
        summary: { type: string }
        createdAt: { type: string }
        screens:
          type: array
          items: { $ref: "#/components/schemas/SavedScreen" }
    CopilotInput:
      type: object
      additionalProperties: false
      required: [question, requestId]
      properties:
        question: { type: string, minLength: 5, maxLength: 800 }
        requestId: { type: string, minLength: 8, maxLength: 100 }
    CopilotCitation:
      type: object
      required: [reportId, domain, period, retrievedAt, sourceUrl, label]
      properties:
        reportId: { type: ["string", "null"] }
        domain: { type: string }
        period: { type: string }
        retrievedAt: { type: string }
        sourceUrl: { type: string }
        label: { type: string }
    CopilotAnswer:
      type: object
      required: [id, compilationId, question, answer, freshLookup, citations, createdAt]
      properties:
        id: { type: string }
        compilationId: { type: string }
        question: { type: string }
        answer: { type: string }
        freshLookup: { type: boolean }
        createdAt: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/CopilotCitation" }
    ExplanationInput:
      type: object
      required: [screenId, question, requestId]
      properties:
        screenId: { type: string }
        question: { type: string, minLength: 5, maxLength: 800 }
        requestId: { type: string, minLength: 8, maxLength: 100 }
    Citation:
      type: object
      required: [label, url, period, retrievedAt]
      properties:
        label: { type: string }
        url: { type: string }
        period: { type: string }
        retrievedAt: { type: string }
    Explanation:
      type: object
      required: [id, screenId, question, answer, citations, createdAt]
      properties:
        id: { type: string }
        screenId: { type: string }
        question: { type: string }
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        createdAt: { type: string }
    Plan:
      type: object
      required: [tier, name, monthlyPrice, screenLimit, aiLimit, checkoutAvailable]
      properties:
        tier: { type: string, enum: [free, pro, team, enterprise] }
        name: { type: string }
        monthlyPrice: { type: integer, description: "Minor units of the listed currency; zero when not configured." }
        currency: { type: ["string", "null"] }
        monthlyPriceDisplay: { type: ["string", "null"] }
        screenLimit: { type: integer }
        aiLimit: { type: integer }
        checkoutAvailable: { type: boolean }
    PlanCatalog:
      type: object
      required: [plans, billingStatus, note]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/Plan" }
        billingStatus:
          type: object
          required: [mode, enabled, webhookVerified, periodicReconciliationVerified, limitation]
          properties:
            mode: { type: string, enum: [test, live, unavailable] }
            enabled: { type: boolean }
            webhookVerified: { type: boolean }
            periodicReconciliationVerified: { type: boolean }
            limitation: { type: ["string", "null"] }
        note: { type: string }
    CheckoutInput:
      type: object
      required: [tier]
      properties:
        tier: { type: string, enum: [pro, team, enterprise] }
    BillingLink:
      type: object
      required: [url]
      properties:
        url: { type: string }

